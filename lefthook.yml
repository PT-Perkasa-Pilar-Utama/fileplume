pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    boundaries:
      glob: "*.ts"
      run: bun run scripts/check_module_boundaries.ts

pre-push:
  commands:
    test:
      # lefthook derives the pre-push file list by diffing the remote default
      # branch. On a clone with no local `dev` that is
      # `git diff --name-only HEAD dev --`, which exits 128 and blocks the push.
      # An explicit `files` command removes the branch dependency.
      # A push that changes no files still skips, which is correct.
      files: "git ls-files"
      run: bun test
