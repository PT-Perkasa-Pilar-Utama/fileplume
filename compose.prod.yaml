# Production overlay. Apply on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env up -d
#
# Differences from the dev topology:
#   - images are pulled from GHCR at an exact SHA, never built on the host
#   - no host port bindings except Caddy 80/443; datastores are reachable only
#     on the compose network
#   - datastore credentials have no default; compose refuses to render
#     without them
#   - Caddy terminates TLS and serves the built SPA
#   - everything restarts unless explicitly stopped

name: archiva

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  opensearch:
    ports: !reset []
    restart: unless-stopped

  valkey:
    ports: !reset []
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  clamav:
    ports: !reset []
    restart: unless-stopped

  gotenberg:
    ports: !reset []
    restart: unless-stopped

  migrate:
    build: !reset null
    image: ghcr.io/pt-perkasa-pilar-utama/archiva-api:${ARCHIVA_VERSION:?set ARCHIVA_VERSION to a git sha}

  api:
    build: !reset null
    image: ghcr.io/pt-perkasa-pilar-utama/archiva-api:${ARCHIVA_VERSION:?set ARCHIVA_VERSION to a git sha}
    ports: !reset []
    restart: unless-stopped

  worker:
    build: !reset null
    image: ghcr.io/pt-perkasa-pilar-utama/archiva-worker:${ARCHIVA_VERSION:?set ARCHIVA_VERSION to a git sha}
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ARCHIVA_DOMAIN: ${ARCHIVA_DOMAIN:?set ARCHIVA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist:/srv:ro
      - caddydata:/data
      - caddyconfig:/config
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api

volumes:
  caddydata:
  caddyconfig:
