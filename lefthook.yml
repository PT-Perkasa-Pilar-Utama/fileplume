pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    boundaries:
      glob: "*.ts"
      run: bun run scripts/check_module_boundaries.ts

pre-push:
  commands:
    test:
      # `files` is set explicitly so lefthook never derives a changed-file list
      # for this hook. Its default derivation diffs against the remote default
      # branch, which produced two failures:
      #   - no local `dev`: `git diff --name-only HEAD dev --` exits 128 and
      #     blocks the push outright
      #   - pushing `dev` itself: the diff is empty, so the suite was skipped
      # `git ls-files` always succeeds and is never empty, so the suite runs.
      files: "git ls-files"
      glob: "*"
      run: bun test
