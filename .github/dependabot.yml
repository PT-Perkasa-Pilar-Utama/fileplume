version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["@biomejs/*", "typescript", "lefthook", "@types/*"]
      react:
        patterns: ["react", "react-dom", "@vitejs/*", "vite"]
    labels: ["type:chore", "area:infra"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:infra"]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories: ["/apps/api", "/apps/worker"]
    schedule:
      interval: weekly
      day: monday
    labels: ["type:chore", "area:infra"]
    commit-message:
      prefix: chore
