# CI overlay for the e2e job. Apply on top of compose.yaml:
#   COMPOSE_FILE=compose.yaml:compose.ci.yaml docker compose up -d --build --wait api
#
# Differences from the dev topology:
#   - blobs go to a dedicated AWS S3 bucket instead of MinIO, whose images are
#     no longer published on quay.io or Docker Hub
#   - api and worker no longer wait on minio-init, so MinIO is never pulled
#   - the CI_S3_* values have no default; compose refuses to render without
#     them. They are distinct from the S3_* keys in .env so a missing secret
#     fails here instead of silently falling back to the MinIO values.
#
# The bucket is shared by every e2e run. ci.yml serialises the job and empties
# t/ afterwards, because the reset route purges t/ across the whole bucket.
# technical-specs/11-environment-configuration.md 11.2.

name: archiva

x-ci-blob-environment: &ci-blob-environment
  S3_ENDPOINT: https://s3.${CI_S3_REGION:?set CI_S3_REGION}.amazonaws.com
  S3_REGION: ${CI_S3_REGION:?set CI_S3_REGION}
  S3_BUCKET: ${CI_S3_BUCKET:?set CI_S3_BUCKET}
  S3_ACCESS_KEY_ID: ${CI_S3_ACCESS_KEY_ID:?set CI_S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${CI_S3_SECRET_ACCESS_KEY:?set CI_S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "false"

services:
  api:
    environment: *ci-blob-environment
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
      gotenberg: { condition: service_healthy }

  worker:
    environment: *ci-blob-environment
    depends_on: !override
      migrate: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
      clamav: { condition: service_healthy }
