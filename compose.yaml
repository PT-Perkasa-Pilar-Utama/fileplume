name: archiva

services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_USER: archiva
      POSTGRES_PASSWORD: archiva
      POSTGRES_DB: archiva
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiva"]
      interval: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]

  valkey:
    image: valkey/valkey:8.1
    ports: ["6379:6379"]
    volumes: [valkeydata:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archiva
      MINIO_ROOT_PASSWORD: archiva-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    volumes: [clamdb:/var/lib/clamav]

  gotenberg:
    image: gotenberg/gotenberg:8.15.0
    ports: ["3001:3000"]

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["bun", "run", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://archiva:archiva@postgres:5432/archiva
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: [.env]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  osdata:
  valkeydata:
  miniodata:
  clamdb:
