name: archiva

# Third-party images pin a minor tag and a digest. technical-specs/04-tech-stack.md 4.10.
# Refresh a digest in the monthly dependency batch with:
#   docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'
# scripts/check_compose.ts fails CI on an unpinned image or a missing healthcheck.

# api, worker and migrate reach the datastores by service name. These override
# the localhost URLs in .env, which serve processes run on the host.
x-in-network-environment: &in-network-environment
  DATABASE_URL: postgres://archiva:${POSTGRES_PASSWORD:-archiva}@postgres:5432/archiva
  VALKEY_URL: redis://valkey:6379
  OPENSEARCH_URL: http://opensearch:9200
  S3_ENDPOINT: http://blobstore:8333
  CLAMAV_HOST: clamav
  GOTENBERG_URL: http://gotenberg:3000

services:
  postgres:
    image: postgres:17.2@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3
    environment:
      POSTGRES_USER: archiva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archiva}
      POSTGRES_DB: archiva
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiva"]
      interval: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.0@sha256:1f8b88245a6af61e7aa500afe0e87d43401e4b33140bb47230a919428ce3f7cb
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  valkey:
    image: valkey/valkey:8.1@sha256:3fbd2e3e4b6e85e046c1e7c215e8f79087bc0357789184305806664e320996f3
    ports: ["6379:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  # SeaweedFS in single-process mode, S3 gateway only. It creates the bucket on
  # startup and takes the S3_* key pair as its admin identity, so api and worker
  # sign with the same credentials the server was started with.
  blobstore:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - mini
      - -bucket=${S3_BUCKET:-archiva}
      - -master.telemetry=false
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-archiva}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-archiva-secret}
    ports: ["9000:8333"]
    volumes: [blobdata:/data]
    healthcheck:
      # The filer lists the bucket directory only once the bucket exists, so a
      # healthy blobstore is one api can write to.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8888/buckets/${S3_BUCKET:-archiva}/"]
      interval: 5s
      retries: 10
      start_period: 30s

  clamav:
    image: clamav/clamav:1.4@sha256:f156095071757e3838caa50265d65e36cdf7f934a27aacf851ea6d2fadbe8200
    ports: ["3310:3310"]
    volumes: [clamdb:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot downloads the signature database before clamd listens.
      start_period: 300s

  gotenberg:
    image: gotenberg/gotenberg:8.15.0@sha256:59eab80c51ad02b72eb1a972182bae71004b5522644b1f43dfdc48249e996acd
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["bun", "run", "packages/db/src/migrate.ts"]
    env_file: [.env]
    environment: *in-network-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment: *in-network-environment
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobstore: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
      gotenberg: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: [.env]
    environment: *in-network-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobstore: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
      clamav: { condition: service_healthy }

volumes:
  pgdata:
  osdata:
  valkeydata:
  blobdata:
  clamdb:
