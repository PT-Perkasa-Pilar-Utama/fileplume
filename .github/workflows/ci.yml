name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

jobs:
  check:
    runs-on: ubuntu-latest
    # bun test starts a Testcontainers Postgres. A hang fails the job instead of
    # holding a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run scripts/check_module_boundaries.ts
      - run: cp .env.example .env && bun run check:compose
      - run: bun test
      - run: bun run build

  # technical-specs/04-tech-stack.md 4.7: e2e against a composed stack.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      # api and its dependency chain only. worker waits on ClamAV's first
      # signature download, and no pipeline card is wired yet.
      - run: |
          for attempt in {1..3}; do
            echo "Attempt $attempt..."
            docker compose up -d --build --wait api && break || sleep $((2 ** attempt))
          done
      # The specs need a resolvable tenant and a seeded session; a second tenant
      # gives the cross-tenant criteria a host to be refused from. Without this
      # every route answers 404 at step 1 of api-specs/01-conventions.md 1.12.
      - run: docker compose run --rm --no-deps migrate bun run packages/db/src/seeds/qa.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --forbid-only
      - if: failure()
        run: docker compose logs --no-color
      # The report is a diagnostic, not a gate: a full artifact store must not
      # be what turns the job red.
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 3
      - if: always()
        run: docker compose down -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_index.py --specs-dir docs/technical-specs
      - run: python scripts/check_index.py --specs-dir docs/api-specs
      - run: python scripts/check_ac_refs.py docs/TASK_BREAKDOWN.md --business-dir docs/business
      - run: python scripts/recompute_summary.py docs/TASK_BREAKDOWN.md
